<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTHEA VIP - AXManager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 35px;
            border: 2px solid #00ff00;
            border-radius: 20px;
            background: rgba(15, 15, 15, 0.95);
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,255,0,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00ff00;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 20px #00ff00;
        }

        .logo::after {
            content: 'ALTHEA GAMING VIP';
            display: block;
            font-size: 15px;
            letter-spacing: 6px;
            color: rgba(0, 255, 0, 0.75);
            margin-top: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaaaaa;
            font-size: 17px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* Mode Tabs - New Style */
        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 45px;
        }

        .mode-tab {
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .mode-tab.stable {
            background: rgba(0, 255, 0, 0.08);
            color: #00ff00;
            border-color: #00ff00;
        }

        .mode-tab.turbo {
            background: rgba(0, 255, 0, 0.12);
            color: #00ff00;
        }

        .mode-tab.gaming {
            background: #00ff00;
            color: #000000;
            font-weight: 900;
        }

        .mode-tab:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 255, 0, 0.3);
        }

        /* Features - New Card Style */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .feature-btn {
            padding: 22px 18px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #00ff00;
            border-radius: 12px;
            font-size: 15.5px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.6s;
        }

        .feature-btn:hover {
            background: #00ff00;
            color: #000000;
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0, 255, 0, 0.25);
        }

        .feature-btn:hover::before {
            left: 120%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">ALTHEA VIP</div>
        <div class="subtitle">AXMANAGER • PREMIUM PERFORMANCE PLUGIN</div>

        <div class="mode-tabs">
            <div class="mode-tab Smooth">Smooth</div>
            <div class="mode-tab turbo">Turbo</div>
            <div class="mode-tab gaming">Gaming Mode</div>
        </div>

        <div class="features">
            <div class="feature-btn">OFF VSYNC</div>
            <div class="feature-btn">UNLOCK 120 FPS</div>
            <div class="feature-btn">ANTI FPS DROP</div>
            <div class="feature-btn">DISABLE THERMAL THROTTLING</div>
            <div class="feature-btn">ENABLE STABLE FPS</div>
            <div class="feature-btn">HIGH END PERFORMANCE</div>
        </div>
    </div>
</body>
</html>
